<div hidden>  <section aria-labelledby="upload-heading" id="upload-section" class="upload-section">
    <h2 id="upload-heading">Загрузка Excel</h2>
    <p class="gate-note" id="gate-note">Доступно после настройки профиля и проверки сертификата.</p>

    <div class="upload-controls" id="upload-controls" style="display:none">
      <input type="file" id="file-input" accept=".xlsx">
      <button type="button" class="btn btn-primary" id="upload-btn">Проверить файл</button>
    </div>

    <div class="upload-busy" id="upload-busy" style="display:none">
      <span class="spinner"></span> Проверка файла…
    </div>

    <div class="upload-error" id="upload-error" style="display:none"></div>

    <div class="dryrun-results" id="dryrun-results" style="display:none">
      <div class="dryrun-summary" id="dryrun-summary"></div>
      <div id="submission-workspace">
        <div class="selection-toolbar" id="selection-toolbar">
          <label class="select-all-label"><input type="checkbox" id="select-all-kiz" checked> Все КИЗ</label>
          <button type="button" class="btn btn-secondary btn-small" id="select-all-btn">Выбрать все</button>
          <button type="button" class="btn btn-secondary btn-small" id="clear-selection-btn">Снять все</button>
          <span id="selection-summary">Выбрано: 0</span>
        </div>
        <div class="dryrun-tables" id="dryrun-tables"></div>
        <div class="settings-form submission-fields">
          <div class="field"><label for="action-date">Дата вывода из оборота</label><input id="action-date" type="date"></div>
          <div class="field"><label for="document-number">Номер первичного документа</label><input id="document-number" type="text" maxlength="255"></div>
          <div class="field"><label for="document-date">Дата первичного документа</label><input id="document-date" type="date"></div>
          <div class="field"><label for="document-name">Название документа</label><input id="document-name" type="text" maxlength="255" value="Отчёт Wildberries"></div>
        </div>
        <div class="dryrun-actions">
          <button type="button" class="btn btn-secondary" id="cancel-import-btn">Отменить импорт</button>
          <button type="button" class="btn btn-primary" id="submit-cz-btn">Отправить в Честный Знак</button>
        </div>
      </div>
      <div class="excluded-results" id="excluded-results"></div>
    </div>
  </section>
</div>
